name: Tests

# Smoke tests for the compose/Caddyfile generators. These are pure functions
# from puente.yml to a deployment artifact, so a regression here produces a
# broken deployment rather than a crash — worth catching before it ships.

on:
  push:
    branches: [main]
    paths:
      - 'puente/**'
      - 'tests/**'
      - 'puente.yml'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q
