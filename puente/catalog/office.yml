# Office tools — CPU-only, no VRAM, off by default.
#
# Declared rather than hand-written (ADR0012): each of these is a third-party
# image plus a port. None needs a GPU, and none is enabled out of the box —
# someone who only wants a chat interface should not end up running a notebook
# server. Enable the whole set with `puente enable --profile office`.

services:
  - id: stirling_pdf
    name: Stirling PDF
    description: PDF tools (merge, split, OCR, convert)
    image: docker.io/stirlingtools/stirling-pdf:2
    container_port: 8080
    default_port: 8089
    provides: [documents]
    needs_vram_mb: 0
    interface: {path: /}
    api: {path: /api, kind: REST}
    profiles: [office]
    repo: https://github.com/Stirling-Tools/Stirling-PDF

  - id: excalidraw
    name: Excalidraw
    description: Collaborative whiteboard and diagramming
    image: docker.io/excalidraw/excalidraw:v0.17.6
    container_port: 80
    default_port: 3333
    provides: [diagramming]
    needs_vram_mb: 0
    interface: {path: /}
    profiles: [office]
    repo: https://github.com/excalidraw/excalidraw

  - id: jupyter
    name: JupyterLab
    description: Browser-based Python notebook (JupyterLab)
    image: docker.io/jupyter/minimal-notebook:stable
    container_port: 8888
    default_port: 8899
    provides: [notebooks]
    needs_vram_mb: 0
    interface: {path: /}
    api: {path: /api, kind: REST}
    profiles: [office]
    volumes:
      /home/jovyan/work: "{data_dir}/jupyter-notebooks"
    # Empty token = no query-string auth. Safe only because the stack binds this
    # to localhost and, when published, Caddy gates it with basic auth. A token
    # would be better; it belongs in puente.yml's environment block, not here,
    # because a token committed to a catalog file is a credential in git.
    environment:
      JUPYTER_TOKEN: ""
    repo: https://github.com/jupyter/notebook