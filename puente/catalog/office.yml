# Office tools — CPU-only, no VRAM, off by default.
#
# Declared rather than hand-written (ADR0012): each of these is a third-party
# image plus a port. None needs a GPU, and none is enabled out of the box —
# someone who only wants a chat interface should not end up running a notebook
# server. Enable the whole set with `puente enable --profile office`.

services:
  - id: stirling_pdf
    name: Stirling PDF
    description: PDF tools (merge, split, OCR, convert)
    image: docker.io/stirlingtools/stirling-pdf:2
    container_port: 8080
    default_port: 8089
    provides: [documents]
    needs_vram_mb: 0
    interface: {path: /}
    api: {path: /api, kind: REST}
    profiles: [office]
    repo: https://github.com/Stirling-Tools/Stirling-PDF

  - id: excalidraw
    name: Excalidraw
    description: Collaborative whiteboard and diagramming
    image: docker.io/excalidraw/excalidraw:v0.17.6
    container_port: 80
    default_port: 3333
    provides: [diagramming]
    needs_vram_mb: 0
    interface: {path: /}
    profiles: [office]
    repo: https://github.com/excalidraw/excalidraw

  - id: jupyter
    name: JupyterLab
    description: Browser-based Python notebook (JupyterLab)
    image: docker.io/jupyter/minimal-notebook:stable
    container_port: 8888
    default_port: 8899
    provides: [notebooks]
    needs_vram_mb: 0
    interface: {path: /}
    api: {path: /api, kind: REST}
    profiles: [office]
    volumes:
      /home/jovyan/work: "{data_dir}/jupyter-notebooks"
    # Empty token = no query-string auth. Safe only because the stack binds this
    # to localhost and, when published, Caddy gates it with basic auth. A token
    # would be better; it belongs in puente.yml's environment block, not here,
    # because a token committed to a catalog file is a credential in git.
    environment:
      JUPYTER_TOKEN: ""
    repo: https://github.com/jupyter/notebook

  # AI presentation generator (Gamma alternative): prompt or document in,
  # fully editable PPTX/PDF out. CPU-only — it delegates generation to the
  # stack's engine rather than running a model. Also speaks MCP at /mcp with
  # admin-provisioned API keys (sk-presenton-...), so scripts and agents can
  # drive deck generation without the browser.
  #
  # Upstream publishes only `latest` and versioned betas — no stable tags.
  # Pinned to the newest beta for reproducibility (ADR0009's rule: a floating
  # tag means a `puente up` months from now runs code nobody tested). Bump
  # deliberately, not routinely.
  - id: presenton
    name: Presenton
    description: AI slide decks — prompt or document to editable PPTX/PDF
    image: ghcr.io/presenton/presenton:v0.9.11-beta
    container_port: 80
    default_port: 5001
    provides: [presentations]
    needs_vram_mb: 0
    interface: {path: /}
    api: {path: /api/v1, kind: REST + MCP}
    profiles: [office]
    volumes:
      /app_data: "{data_dir}/presenton"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Generation is delegated to the stack's own engine. For any other
      # OpenAI-compatible endpoint, override with
      # LLM=custom + CUSTOM_LLM_URL/CUSTOM_LLM_API_KEY/CUSTOM_MODEL in
      # puente.yml's environment block.
      LLM: ollama
      OLLAMA_URL: "http://host.docker.internal:11434"
      # Must exist in `ollama list` on the host. A missing model fails at
      # generation time, not at boot — which is why it is pinned here rather
      # than left to presenton's defaults.
      OLLAMA_MODEL: "gemma4:latest"
      # Privacy posture: the community gallery phones home by default, and
      # anonymous telemetry is on by default. Both off, matching the stack's
      # local-first commitment (docs/vision.md).
      PRESENTON_COMMUNITY_ENABLED: "false"
      DISABLE_ANONYMOUS_TRACKING: "true"
      # Web grounding through the stack's own SearXNG — same convention as
      # Open WebUI. Resolves only while searxng is enabled; with LLM=ollama
      # and provider=searxng, search silently degrades to off if it is not.
      WEB_GROUNDING: "true"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://puente-searxng:8080"
    repo: https://github.com/presenton/presenton