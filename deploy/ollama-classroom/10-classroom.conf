# Ollama tuning for classroom use (ISYS6014 module 01: ~40 students running the
# same prompt across a local and a frontier model in one 40-min block).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-classroom/10-classroom.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# A drop-in overrides the Environment= lines in the packaged unit without
# editing it, so an Ollama upgrade that rewrites ollama.service won't silently
# revert this.
[Service]
# GPU 1 ONLY — the 4060 Ti 16GB. The whole point of this line is to keep Ollama
# OFF the 3090, leaving all 24GB of GPU 0 for ComfyUI / SwarmUI / avatar nodes.
#
# History, because this line has flip-flopped and the reasons are easy to lose:
#
#   * Originally "0" (3090 only). Both classroom models could not fit, so every
#     model switch cost a 13-20s reload from disk.
#   * Then "0,1" to span the 3090 + 2060 Super, which DID keep both resident
#     (27.8GB of models across 24GB+8GB, no eviction). It also, on some
#     ollama/CUDA combinations, made Ollama build a CUDA VMM pool across the
#     mismatched pair and abort in the runner before any model loaded:
#         GGML_ASSERT(pool_size + reserve_size <= CUDA_POOL_VMM_MAX_SIZE) failed
#         llama runner terminated  error="exit status 2"
#     A total outage on BOTH cards, not a degraded fallback. That crash was at
#     one point blamed on OLLAMA_NUM_PARALLEL=8 instead; the two explanations
#     were never cleanly separated, which is exactly why "0,1" is not worth
#     going back to.
#   * Now the 4060 Ti's UUID (2026-07-25): the 2060 Super was replaced by a
#     4060 Ti 16GB, which holds gemma4:12b on its own with room to spare. A
#     single card means no cross-device VMM pool can be built, so the crash mode
#     above is structurally impossible rather than merely unobserved.
#
# WHY A UUID AND NOT "1" — this bit is not cosmetic, it was a live failure.
# "CUDA_VISIBLE_DEVICES=1" was tried first and put the model on the WRONG CARD,
# the exact opposite of this line's purpose. Two things went wrong together:
#
#   1. CUDA_VISIBLE_DEVICES masks devices from the CUDA driver ONLY. Ollama 0.32
#      also enumerates a VULKAN backend, which ignores the variable completely.
#      So CUDA saw one device (the 4060 Ti, renumbered to CUDA0 — indices shift
#      after masking) while Vulkan still enumerated the 3090 as Vulkan1:
#        library=Vulkan compute=0.0 name=Vulkan1 description="RTX 3090"
#      The scheduler saw available_gpu_count=2, picked the card with more free
#      VRAM (23.5 GiB vs 15.4), and loaded onto the 3090 over Vulkan — slower
#      than CUDA, and squatting on the card this whole change exists to free.
#   2. Indices are not stable anyway: they renumber under masking, and would
#      shift again if a card were added, removed or re-seated.
#
# A UUID fixes both. It is unambiguous, survives masking and re-seating, and is
# what nvidia-smi -L reports. Pair it with OLLAMA_LLM_LIBRARY below — the UUID
# alone still leaves the Vulkan backend free to enumerate the 3090.
#
# GPU-ce79654c... is the RTX 4060 Ti. Re-check with `nvidia-smi -L` if a card
# is ever swapped; a stale UUID here means Ollama finds no GPU and silently
# falls back to CPU.
Environment="CUDA_VISIBLE_DEVICES=GPU-ce79654c-917a-e928-ad48-aca7c8014f47"

# Force the CUDA backend and stop Vulkan autodetection dead. Without this,
# Ollama enumerates BOTH a cuda_v13 and a vulkan backend, and Vulkan does not
# honour CUDA_VISIBLE_DEVICES — see the failure described above.
#
# "cuda_v13" is not a guess: it is the libdir name Ollama itself logs
# (libdirs=ollama,cuda_v13) and a real directory under /usr/local/lib/ollama/,
# alongside cuda_v12 and vulkan. Driver here is 13.2, so v13 is correct.
# (OLLAMA_VULKAN is NOT a real variable — checked against `ollama serve --help`
# on 0.32.3. OLLAMA_LLM_LIBRARY is the documented knob: "Set LLM library to
# bypass autodetection".)
Environment="OLLAMA_LLM_LIBRARY=cuda_v13"

# TWO slots, for a different reason than before. It is no longer about holding
# two big chat models: gemma4:12b is text+vision+audio in one model, which
# retired the old qwen3.5:9b + qwen2.5vl:7b-16k pair that needed two cards.
#
# The second slot now exists for LibreChat's titleModel (qwen3.5:0.8b, ~1GB).
# Titling fires on every new chat. At slot count 1 that background call would
# EVICT the pinned gemma4:12b every single time, so the next student pays a full
# reload from disk — exactly what preloading and KEEP_ALIVE=-1 are meant to stop.
#
# The obvious-looking alternative — point titleModel at gemma4:12b so no second
# model is ever named — is WRONG, and was already tried and fixed in 2ba8e62:
# titling against the model serving the live chat is LibreChat's 'current_model'
# default, which fires a second concurrent inference, aborts under contention
# ("This operation was aborted") and leaves chats untitled. OLLAMA_NUM_PARALLEL=1
# means that second request queues behind the live one, and on the 4060 Ti's
# lower bandwidth that queue is longer than it was on the 3090.
#
# So: two models resident (8.4GB + 1GB), comfortably inside 16GB, and neither
# evicts nor contends with the other.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# Concurrent request slots per loaded model. Each slot reserves its OWN KV
# cache, so a model's VRAM footprint scales with NUM_PARALLEL — this is a
# memory setting as much as a throughput one.
#
# Set to 1 deliberately. At 4, the two classroom models could not be resident
# together on the 24GB card: loading the second logged
#   "model requires more gpu memory than is currently available, evicting a
#    model to make space"
# so every switch between the text and vision model became a full evict +
# reload from disk — the exact thrashing MAX_LOADED_MODELS=2 was meant to stop.
# At 1 both fit (~9.5GB each) and switching is instant.
#
# Raising this trades resident models for concurrency. With 40 students the
# card's memory bandwidth is the real ceiling anyway, so the trade is a bad
# one: keep both models warm instead. Verified ollama 0.20.2, 2026-07-20.
#
# Still 1 on the 4060 Ti, for a sharper reason: that card has a THIRD of the
# 3090's bandwidth, so it is even more firmly the bottleneck. Extra parallel
# slots would only buy interleaved-but-slower answers while each slot reserves
# its own KV cache against a 16GB budget.
Environment="OLLAMA_NUM_PARALLEL=1"

# Never unload. Was 3h to span a single workshop; now "-1" (hold forever)
# because the model is preloaded at boot by ollama-preload.service and is
# meant to stay resident on GPU 1 permanently. With a 3h TTL the model would
# silently vanish overnight and the first request of the next day would pay a
# cold disk read — defeating the point of preloading it.
#
# This is only safe because Ollama is now confined to GPU 1: an unevictable
# model on the SHARED 3090 would have permanently taxed ComfyUI/SwarmUI.
Environment="OLLAMA_KEEP_ALIVE=-1"

# Pin the context window. Ollama's default is small (4096 on 0.32), while
# gemma4:12b advertises 262144 — so this is as much a guard against the ceiling
# as a raise off the floor: an unpinned long conversation can balloon the KV
# cache, and 16GB has far less slack than the 3090 did.
#
# 16384 holds a full lab conversation with room for an attached image, at a KV
# cost of roughly 1GB on top of the ~8.4GB of weights. Raise only with
# nvidia-smi open.
Environment="OLLAMA_CONTEXT_LENGTH=16384"

# Listen on all interfaces, not just loopback. Ollama defaults to
# 127.0.0.1:11434, which puente-caddy CANNOT reach: Caddy runs in a container
# and proxies to the host's LAN address (192.168.20.120:11434), so a
# loopback-only bind answers the host but returns 502 through the proxy.
#
# Symptom, 2026-07-24: `curl 127.0.0.1:11434/api/tags` returned 200 while
# https://ollama.locollm.org/api/tags returned 502, with ollama.service active
# and healthy. `ss -lntp | grep 11434` showing 127.0.0.1 (not 0.0.0.0) is the
# tell. An Ollama restart is what exposed it — nothing here had set OLLAMA_HOST,
# so the LAN bind was never actually pinned, it just happened to be in effect.
#
# SECURITY: this opens 11434 to the LAN with NO authentication. The bearer
# token gate lives in Caddy, so it only protects the public HTTPS path; anyone
# on the local network can hit the API directly. Acceptable on a trusted lab
# network — firewall the port if that stops being true.
Environment="OLLAMA_HOST=0.0.0.0:11434"
