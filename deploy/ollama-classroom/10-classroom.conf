# Ollama tuning for classroom use (ISYS6014 module 01: ~40 students running the
# same prompt across a local and a frontier model in one 40-min block).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-classroom/10-classroom.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# A drop-in overrides the Environment= lines in the packaged unit without
# editing it, so an Ollama upgrade that rewrites ollama.service won't silently
# revert this.
[Service]
# GPU 0 only — matching the packaged unit's default.
#
# "0,1" was tried and reverted, but NOT for the reason first recorded here: the
# GGML_ASSERT crash blamed on mixed compute capabilities (8.6 vs 7.5) also fired
# with a single GPU visible, so the mixed-card theory was wrong. The real cause
# of that crash was OLLAMA_NUM_PARALLEL=8 inflating the KV reservation.
#
# "0,1" is left off because it buys nothing, not because it is known-broken:
# Ollama places models on whichever GPU has the most free VRAM, and the 3090
# always beats the 8GB 2060S, so GPU 1 would sit unused. Putting a model on the
# 2060S requires a SEPARATE Ollama instance pinned with CUDA_VISIBLE_DEVICES=1
# on its own port. Re-test before trusting "0,1" either way.
Environment="CUDA_VISIBLE_DEVICES=0"

# Permits two resident models. In practice the two classroom models do NOT fit
# together on the 24GB card, so this is aspirational — Ollama still evicts one
# to load the other and a model switch costs a reload. Left at 2 because it
# costs nothing and helps whenever a smaller pair is in play.
#
# Why they don't fit: qwen2.5vl:7b-16k takes 17GB, of which only 5.3GB is
# weights and 0.9GB is KV cache — 9.4GB is the COMPUTE GRAPH, the vision
# tower's activation buffer, sized for the largest image the model can take.
# It is allocated even for text-only prompts and no context/parallel setting
# reduces it. 17GB + qwen3.5:9b's 9.5GB > 24GB, so one always evicts the other.
#
# Accepted deliberately: a few seconds on a model switch is fine for the lab,
# and the pause is itself visible evidence of what local inference costs.
# Avoiding it entirely needs the text model on GPU 1 via a second Ollama
# instance — see docs/classroom-models.md.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# Concurrent request slots per loaded model. Each slot reserves its OWN KV
# cache, so a model's VRAM footprint scales with NUM_PARALLEL — this is a
# memory setting as much as a throughput one.
#
# Set to 1 deliberately. At 4, the two classroom models could not be resident
# together on the 24GB card: loading the second logged
#   "model requires more gpu memory than is currently available, evicting a
#    model to make space"
# so every switch between the text and vision model became a full evict +
# reload from disk — the exact thrashing MAX_LOADED_MODELS=2 was meant to stop.
# At 1 both fit (~9.5GB each) and switching is instant.
#
# Raising this trades resident models for concurrency. With 40 students the
# card's memory bandwidth is the real ceiling anyway, so the trade is a bad
# one: keep both models warm instead. Verified ollama 0.20.2, 2026-07-20.
Environment="OLLAMA_NUM_PARALLEL=1"

# Span the whole workshop. Default is 5 min, so a model would unload during any
# lull (a break, a tutor-led segment) and the next student would pay a full
# reload from disk mid-class.
Environment="OLLAMA_KEEP_ALIVE=3h"
