# Ollama tuning for classroom use (ISYS6014 module 01: ~40 students running the
# same prompt across a local and a frontier model in one 40-min block).
#
# Install:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-classroom/10-classroom.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# A drop-in overrides the Environment= lines in the packaged unit without
# editing it, so an Ollama upgrade that rewrites ollama.service won't silently
# revert this.
[Service]
# Both cards, as a FALLBACK — not to spread load. Ollama places each model on
# whichever GPU has the most free VRAM at load time, and an empty 3090 (24GB)
# always beats the 2060 Super (8GB), so in normal operation BOTH classroom
# models land on GPU 0 and GPU 1 goes unused. That is fine and expected.
#
# The value of listing GPU 1 is the abnormal case: if something else is holding
# most of the 3090 (ComfyUI has been seen sitting on 18GB while idle — see
# comfyui-idle-unload.sh), Ollama can still place a model on the 2060S instead
# of failing to load mid-lab. Slower, but serving.
#
# Deterministic per-model placement is NOT possible this way; it needs a second
# Ollama instance pinned to GPU 1 on its own port. Not worth it while pass B
# (the vision model) is naturally staggered by students finding screenshots.
#
# Voicebox normally owns GPU 1 (see docs/service-topology.md) but is not in play
# for this lab; revisit if it is running during class.
Environment="CUDA_VISIBLE_DEVICES=0,1"

# Keep both classroom models resident instead of evicting on every switch.
# Default is 1, which is what made switching feel expensive.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# Batch concurrent requests against a loaded model. This raises THROUGHPUT, not
# per-user speed: the card's memory bandwidth is the ceiling, so 20 concurrent
# users still see a fraction of single-stream tokens/sec. Staggering the class
# across local vs frontier does more for perceived speed than this number.
Environment="OLLAMA_NUM_PARALLEL=8"

# Span the whole workshop. Default is 5 min, so a model would unload during any
# lull (a break, a tutor-led segment) and the next student would pay a full
# reload from disk mid-class.
Environment="OLLAMA_KEEP_ALIVE=3h"
