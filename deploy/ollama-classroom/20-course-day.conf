# COURSE-DAY ONLY (2026-10-28 exec-ed lab): four parallel request slots.
#
# Ollama applies drop-ins in filename order and the LAST assignment of a
# variable wins, so this 20- file overrides the OLLAMA_NUM_PARALLEL=1 in
# 10-classroom.conf for as long as it exists here.
#
# Why 4: ~20 exec-ed participants fire questions in bursts; at 1 slot the 5th
# concurrent request queues behind live ones. Four slots interleave compute on
# the 3090 so nobody queues. Each slot reserves its OWN 16k KV cache (~1GB),
# so qwen3.5:9b grows ~6.1GB -> ~10GB resident: ~11.5GB total with the title
# model, comfortable in 24GB. (This knob was deliberately 1 on the 16GB 4060 Ti
# -- see the thrashing history in 10-classroom.conf; the 3090 changes that.)
#
# FINDING 2026-10-27 (ollama 0.32.3): the env IS honoured server-side, but the
# RUNNER loads qwen3.5:9b as ONE sequence regardless (n_ctx=16384, one "new
# slot", 512MiB KV) — almost certainly a hybrid-attention architecture cap in
# llama.cpp. llama3.1:latest on the same server DID get 4 real sequences
# (n_ctx=65536, 4x KV, SIZE 13GB). So for qwen3.5 this file is a NO-OP:
# concurrent students queue (transparent, max_queue=512, ~2s per answer).
# Leave it installed if the course model ever changes to a standard-attention
# arch (llama/gemma/qwen2.5) — 4 slots then engage automatically.
#
# Install:
#   sudo cp deploy/ollama-classroom/20-course-day.conf /etc/systemd/system/ollama.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Verify (after warming a model): `ollama ps` SIZE ~10GB (4x KV), not 6.1GB.
# (`systemctl show` is misleading here: it lists BOTH the =1 and the =4 lines.)
#
# Remove AFTER the course day:
#   sudo rm /etc/systemd/system/ollama.service.d/20-course-day.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
Environment="OLLAMA_NUM_PARALLEL=4"
