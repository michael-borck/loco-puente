  librechat:
    enabled: true
    install_method: docker
    port: 3080
    gpu: null
    managed: true
    # Signup rate limiters, effectively disabled on purpose.
    #
    # LibreChat rate-limits registration BY CLIENT IP (removePorts(req.ip), with
    # TRUST_PROXY=1 so it sees the real client through puente-caddy, not the
    # proxy). A whole lab NATs to ONE campus IP, so the entire class shares a
    # single bucket. At the stock REGISTER_MAX=5/60min this cost a 40-student
    # class most of its session on 2026-07-22: 4 accounts at 08:38:49-08:39:20,
    # then nothing until the window rolled over and 4 more got in at
    # 09:35:17-09:36:02. 8 of 40 registered; the rest saw
    # "Too many accounts created, please try again after 60 minutes".
    #
    # Set absurdly high rather than "generously" high — the limit must never be
    # the thing that fails in front of a class, and a second cohort on the same
    # IP must not inherit a half-drained bucket. Do NOT use 0 to mean unlimited:
    # in express-rate-limit 0 blocks EVERY request.
    #
    # Abuse risk is near zero without it: registration is already gated by
    # allowed_registration_domains (Curtin only) plus mandatory email
    # verification, and chat.locopuente.org is only up during the lab window
    # (deploy/chat-window.sh). Those gates, not the IP limiter, are the control.
    #
    # VERIFY_EMAIL_* covers the resend-verification endpoint (stock 2 per 2 min,
    # also per-IP): a few mistyped addresses in one room would otherwise lock
    # everyone out of resends. Each 429 also calls logViolation, which feeds the
    # violation/ban layer, so a tight limit can escalate past its own window.
    environment:
      REGISTER_MAX: '10000'
      REGISTER_WINDOW: '60'
      VERIFY_EMAIL_MAX: '10000'
      VERIFY_EMAIL_WINDOW: '2'
    review: true
    proxy:
      host: chat.locopuente.org
      auth: none
      token_env: null
      basic_group: null
      port: 3080
      upstream: null
      # LibreChat is stopped outside lab hours by deploy/chat-window.sh, so a
      # bare 502 would be the normal out-of-hours experience. Serve the lab
      # timetable instead.
      offline_page: chat-closed.html
    mongo_uri: null
    jwt_secret: bc7b375cf786ec343a9853fc95e7bc01a9ffec7b0b28664f7e4b88ab833b1145
    jwt_refresh_secret: 924cd338fd5618c23b3a7a9dc7a1cfe715936c86beaf8eb072c10234835dfecb
    creds_key: 312c3ed097b353814db93a4881bbaa4a4a7bd067ea2609b8d8135aacb7f3a356
    creds_iv: 6ec53bf663221014099fbb678cf203d9
    ollama_base_url: null
    # Picker list, in picker order. Trimmed for ISYS6014 module 01, which runs
    # one prompt across a local and a frontier model, then repeats it with an
    # image attached. Four near-identical qwens were choice paralysis without
    # serving either axis of that comparison.
    #   qwen3.5:9b    - the local contender; big enough to be a fair fight
    #   qwen2.5vl:7b  - the ONLY local model that reads images (activity pass B)
    #   gemma4:12b    - newer local contender, added 2026-07-24
    # THE THREE NO LONGER ALL FIT. Measured on the idle 3090 that day: loading
    # qwen3.5:9b (6.7GB) + gemma4:12b (8.4GB) leaves 17.2GB used and only 7.0GB
    # free, so qwen2.5vl:7b-16k (~9.5GB) is EVICTED rather than co-resident.
    # The old "both stay resident, switching is free" property is gone; a
    # student who switches to the vision model now pays a ~16s reload, and
    # switching back evicts whatever it displaced. That is the load-tax
    # thrashing pattern, so if module 01's image pass feels slow, drop
    # gemma4:12b from this list rather than adding a fourth entry.
    # The frontier side is anthropic_models below — API-side, so no VRAM and no
    # local concurrency limit. Removing a model here does NOT delete it from
    # Ollama; `ollama list` still has 0.8b/2b/4b/coder for other uses.
    models:
    - qwen3.5:9b
    # NOT stock qwen2.5vl:7b — that declares a 128k context, and Ollama sizes
    # KV cache from the declared context, so it demands ~36GB and fails to load
    # on a 24GB card. This variant is the same weights with num_ctx baked to
    # 16384 (see docs/classroom-models.md); it offloads 33/33 layers and uses
    # ~9.5GB. Recreate with:
    #   printf 'FROM qwen2.5vl:7b\nPARAMETER num_ctx 16384\n' > vl.Modelfile
    #   ollama create qwen2.5vl:7b-16k -f vl.Modelfile
    - qwen2.5vl:7b-16k
    # Gemma 4. Thinking is ON by default and costs a lot for classroom Q&A:
    # same word problem, warm, think=true vs think=false —
    #   qwen3.5:9b  1755 tok / 19.8s  ->  293 tok / 4.2s
    #   gemma4:12b   525 tok /  9.5s  ->  153 tok / 3.5s
    # Both still answered correctly with thinking off. Ollama takes "think":
    # false per-request (CLI: --think=false); it is NOT a puente.yml setting,
    # so LibreChat must send it or students wait ~5x on every reply.
    - gemma4:12b
    # Not in the picker on purpose — titling is a background call, so it should
    # use the cheapest model on the box, not one students would choose.
    title_model: qwen3.5:0.8b
    anthropic_key_env: ANTHROPIC_API_KEY
    anthropic_models:
    - claude-sonnet-5
    - claude-haiku-4-5
    allowed_registration_domains:
    - curtin.edu.au
    - student.curtin.edu.au
    - postgraduate.curtin.edu.au
    # Verification email is REQUIRED, not optional: without it a student who
    # mistypes their address gets a working account on the wrong email, then
    # registers again next lab when the right address says "user not found" —
    # duplicate accounts and lost history. It also gates self-service password
    # reset, which tutors cannot do on the operator's behalf.
    #
    # EMAIL_PASSWORD is resolved from RESEND_API_KEY in the host environment and
    # written to a .env file at `puente up` — NOT emitted as a ${VAR} compose
    # placeholder. See _write_env_file in services/librechat.py for why.
    email_host: smtp.resend.com
    email_port: 587
    email_username: resend
    email_password_env: RESEND_API_KEY
    email_from: librechat@onboarding.locoensayo.org
    email_from_name: Libre Chat
