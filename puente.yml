    ollama_base_url: null
    # Picker list, in picker order. Trimmed for ISYS6014 module 01, which runs
    # one prompt across a local and a frontier model, then repeats it with an
    # image attached. Four near-identical qwens were choice paralysis without
    # serving either axis of that comparison.
    #   qwen3.5:9b    - the local contender; big enough to be a fair fight
    #   qwen2.5vl:7b  - the ONLY local model that reads images (activity pass B)
    # Both stay resident together (~13GB of 24GB) so switching costs nothing.
    # The frontier side is anthropic_models below — API-side, so no VRAM and no
    # local concurrency limit. Removing a model here does NOT delete it from
    # Ollama; `ollama list` still has 0.8b/2b/4b/coder for other uses.
    models:
    - qwen3.5:9b
    - qwen2.5vl:7b
    # Not in the picker on purpose — titling is a background call, so it should
    # use the cheapest model on the box, not one students would choose.
    title_model: qwen3.5:0.8b
    anthropic_key_env: ANTHROPIC_API_KEY
    anthropic_models:
    - claude-sonnet-5
    - claude-haiku-4-5
    allowed_registration_domains:
    - curtin.edu.au
    - student.curtin.edu.au
    - postgraduate.curtin.edu.au
    email_host: smtp.resend.com
    email_port: 587
    email_username: resend
